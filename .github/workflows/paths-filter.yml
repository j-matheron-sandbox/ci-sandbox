name: paths-filter
on:
  pull_request:
  push:
    branches: [main]

  
jobs:
  source-changes:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ github.event_name != 'pull_request' || steps.filter.outputs.include-files-to-check }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            include-files-to-check:
              - 'paths-filter/**' 
              - '.github/workflows/paths-filter.yml' 
              - '!paths-filter/CITATION.*'
              - '!**/*.md'
          # check if file is in paths-filters (some-with-excludes requires at least one positive rule)
          # check if file is .github/workflows/paths-filter.yml to have it pass heavy tests
          # check if file is not to be ignored
  heavy-a:
    needs: source-changes
    if: needs.source-changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -qx "hello" paths-filter/src/hello.txt
      
  heavy-b:
    needs: source-changes
    if: needs.source-changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -qx "# notes" paths-filter/docs/notes.md

  all-required-green:
    name: All required checks pass
    if: always()
    needs: [source-changes, heavy-a, heavy-b]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: heavy-a, heavy-b
